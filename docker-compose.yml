name: voicematch-mvp

services:
  db:
    image: postgres:16-alpine
    container_name: voicematch-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: voicematch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: voicematch-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin_password@db:5432/voicematch_db
      AI_SERVICE_URL: http://services:8001
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_TRIAGEM: ${GROQ_MODEL_TRIAGEM:-llama-3.3-70b-versatile}
    volumes:
      - ./media/audio:/app/media/audio

  services:
    build:
      context: ../../VoiceMatchServices
    container_name: voicematch-services
    restart: always
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MOCK_AI: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./media/audio:/app/media/audio

  frontend:
    build:
      context: ../../VoiceMatchFrontend
    container_name: voicematch-front
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
    name: voicematch_pg_data
    external: true
